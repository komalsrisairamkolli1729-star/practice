<!DOCTYPE html>
<html>
<head>
  <title>Event Registration</title>
  <style>
    body { display: grid; place-content: center; height: 100vh; font-family: sans-serif; }
    form { display: grid; gap: 8px; width: 250px; }
  </style>
</head>
<body>
  <form>
    <h2>Register</h2>
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <input type="tel" placeholder="Phone" required>
    <button>Submit</button>
  </form>
</body>
</html>
